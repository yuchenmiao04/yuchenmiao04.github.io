---
layout: default
---

<div class="blog-article" lang="zh-CN">
  <header class="blog-article__header">
    <a class="blog-article__back" href="{{ '/#blog' | relative_url }}">← Blog</a>
    <h1>{{ page.title | escape }}</h1>
    <a class="blog-article__pdf" href="{{ page.pdf_url | relative_url }}">下载 PDF</a>
  </header>
  {{ content }}
  <footer class="blog-article__footer">
    <a href="{{ '/#blog' | relative_url }}">← 返回 Blog</a>
  </footer>
</div>

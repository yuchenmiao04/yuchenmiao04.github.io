- slug: agent-collaboration
  title: 多 Agent 协作的计算结构：Pipeline、Orchestrator 与 Debate
  description: 用计算图分析多 Agent 的静态依赖、动态任务生成、版本提交、关键路径与通信输入量，说明 Pipeline、Orchestrator 和 Debate 怎样组合，以及如何比较它们的实际收益。
  title_en: 'The computational structure of multi-agent systems: pipelines, orchestrators, and debate'
  description_en: An execution-graph analysis of static dependencies, dynamic task generation, versioned commits, critical
    paths, and communication inputs, showing how pipelines, orchestrators, and debate combine and how to evaluate their value.
- slug: agent-debate
  title: Multi-Agent Debate：协议、更新语义与评测
  description: 面向研究者与开发者的 Multi-Agent Debate 技术说明：状态与消息接口、同步与异步更新、错误相关性、逐主张验证、有界执行循环及配对评测。
  title_en: 'Multi-agent debate: protocols, update semantics, and evaluation'
  description_en: A technical guide to multi-agent debate covering state and message interfaces, synchronous and asynchronous
    updates, correlated errors, claim-level verification, bounded execution, and paired evaluation.
- slug: interesting-prompts
  title: 记录一组有趣的提示词
  description: 一组用于讨论决策的提示词：先反驳，再支持，最后中立比较关键证据。
  title_en: A Collection of Interesting Prompts
  description_en: 'A set of prompts for discussing decisions: challenge the idea, make the case for it, and compare the evidence.'
- slug: harness-anything
  title: Harness Anything：面向垂直领域的 Agent 系统设计
  description: 从任务契约、领域证据和执行边界出发，讨论如何设计可核对、可恢复、可评测的垂直领域 Agent 系统。
  title_en: 'Harness Anything: Designing Agent Systems for Specialized Domains'
  description_en: Task contracts, domain evidence, and execution boundaries for agent systems that can be checked, recovered, and evaluated.
- slug: harness-engineering
  title: Harness Engineering：让 Agent 的执行形成闭环
  description: 解释 Harness 如何组织上下文、工具、状态、验收与恢复，让多步任务依据实际结果持续推进。
  title_en: 'Harness Engineering: Closing the Agent Execution Loop'
  description_en: How a harness organizes context, tools, state, acceptance, and recovery so multi-step tasks advance from actual results.
- slug: agent-engineering
  title: Agent Engineering：重试、状态与执行控制
  description: 从 Codex、OpenCode、Pi 与 Claude 的公开实现出发，梳理重试、工具执行、会话状态、上下文管理与任务验收中的工程细节。
  title_en: 'Agent Engineering: Retries, State, and Execution Control'
  description_en: Engineering details of retries, tool execution, session state, context management, and task acceptance, grounded in the public implementations of Codex, OpenCode, Pi, and Claude.
- slug: long-horizon-agents
  title: Long-Horizon Agents：如何持续推进，直到任务真正完成
  description: 从长程能力评测出发，梳理行动反馈、会话交接、目标控制、经验记忆与技能积累的机制。
  title_en: 'Long-Horizon Agents: Sustaining Progress Until the Task Is Truly Complete'
  description_en: From measuring long-horizon capability to the mechanisms behind action feedback, session handoff, goal control, experience memory, and reusable skills.
- slug: skill-progressive-disclosure
  title: Skill 渐进式披露：Pi 与 DeepSeek Harness 如何按需加载
  description: 通过 Pi 与 DeepSeek Harness 的实现，说明技能目录、正文与引用资料如何分层进入模型上下文。
  title_en: 'Progressive Disclosure for Skills: On-Demand Loading in Pi and DeepSeek Harness'
  description_en: How skill catalogs, instructions, and references enter model context in layers, through the implementations of Pi and DeepSeek Harness.
- slug: prompt-engineering
  title: Prompt Engineering：把任务写清楚，把结果验明
  description: 从 Few-shot、思维链与任务分解的经典案例出发，梳理材料组织、结构化输出、结果检查与提示词迭代的方法。
  title_en: 'Prompt Engineering: Define the Task, Verify the Result'
  description_en: Task requirements, context, few-shot examples, CoT, ReAct, decomposition, structured outputs, and evaluation, explained through classic examples and practical boundaries.

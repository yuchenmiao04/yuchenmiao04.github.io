  description: 通过 Pi 与 DeepSeek Harness 的实现，说明技能目录、正文与引用资料如何分层进入模型上下文。
- slug: prompt-engineering
  title: Prompt Engineering：把任务写清楚，把结果验明
  description: 从 Few-shot、思维链与任务分解的经典案例出发，梳理材料组织、结构化输出、结果检查与提示词迭代的方法。
